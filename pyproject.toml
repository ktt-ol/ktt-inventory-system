[project]
name = "ktt-inventory-system"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "django~=5.2.0",
    "Pillow~=10.4.0",
    "requests~=2.26.0",
]

[dependency-groups]
dev = [
    "pytest~=8.3",
    "pytest-django~=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "inventar.settings"
testpaths = ["tests/unit"]
