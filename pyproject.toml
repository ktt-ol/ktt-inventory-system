[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inventar", "inventory"]

[project]
name = "ktt-inventory-system"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "django~=5.2.0",
    "Pillow~=11.0",
    "requests~=2.26.0",
]

[dependency-groups]
dev = [
    "pytest~=8.3",
    "pytest-django~=4.9",
]
prod = [
    "gunicorn~=23.0",
]

# Supports the Nix build: it builds from source and needs these.
[tool.uv.extra-build-dependencies]
asgiref = ["setuptools"]
certifi = ["setuptools"]
charset-normalizer = ["setuptools"]
colorama = ["hatchling"]
django = ["setuptools"]
idna = ["flit-core"]
iniconfig = ["hatchling", "hatch-vcs"]
packaging = ["flit-core"]
pillow = ["setuptools"]
pluggy = ["setuptools"]
pygments = ["hatchling"]
pytest = ["setuptools"]
pytest-django = ["setuptools"]
gunicorn = ["setuptools"]
requests = ["setuptools"]
sqlparse = ["hatchling"]
urllib3 = ["hatchling", "hatch-vcs"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "inventar.settings"
testpaths = ["tests/unit"]
